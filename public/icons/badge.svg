<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a152d"/>
      <stop offset="70%" stop-color="#040c19"/>
      <stop offset="100%" stop-color="#02060e"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1cb83"/>
      <stop offset="50%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#8a671d"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdea3"/>
      <stop offset="50%" stop-color="#f1cb83"/>
      <stop offset="100%" stop-color="#c9a45c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge with Gold Border -->
  <circle cx="256" cy="256" r="248" fill="url(#badgeBg)" stroke="url(#goldRim)" stroke-width="12" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldRim)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Architectural Towers -->
  <g transform="translate(256, 175)" filter="url(#glow)">
    <!-- Tall central tower -->
    <path d="M-8 -65 L18 -105 L26 -92 L26 40 L-8 40 Z" fill="url(#goldFill)"/>
    <path d="M-28 -40 L-10 -70 L-6 -62 L-6 40 L-28 40 Z" fill="url(#goldFill)" opacity="0.9"/>
    <path d="M-44 -15 L-30 -38 L-28 -34 L-28 40 L-44 40 Z" fill="url(#goldFill)" opacity="0.8"/>
  </g>

  <!-- Typography «کلید» Integrated with Key Shaft -->
  <g transform="translate(256, 260)" fill="url(#goldFill)" filter="url(#glow)">
    <!-- Base horizontal curve of Kaf and Lam -->
    <path d="M -160 50 Q -100 48 -40 48 L -40 22 Q -100 22 -140 32 L -140 -10 Q -140 -20 -150 -20 Q -160 -20 -160 -10 Z"/>
    
    <!-- Central Lam / Key Column -->
    <rect x="-10" y="-70" width="22" height="130" rx="3"/>
    
    <!-- Key Bit Details on Left -->
    <rect x="-24" y="28" width="16" height="8" rx="2"/>
    <rect x="-20" y="42" width="12" height="7" rx="2"/>

    <!-- Key Bow / Handle Quatrefoil -->
    <g transform="translate(1, 85)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="url(#goldFill)" stroke-width="10"/>
      <circle cx="0" cy="-15" r="10" fill="none" stroke="url(#goldFill)" stroke-width="7"/>
      <circle cx="0" cy="15" r="10" fill="none" stroke="url(#goldFill)" stroke-width="7"/>
      <circle cx="-15" cy="0" r="10" fill="none" stroke="url(#goldFill)" stroke-width="7"/>
      <circle cx="15" cy="0" r="10" fill="none" stroke="url(#goldFill)" stroke-width="7"/>
    </g>

    <!-- Lettering Ye and Dal on right -->
    <path d="M 20 22 L 140 22 Q 155 22 155 35 Q 155 48 140 48 L 30 48 L 30 22 Z"/>
    <path d="M 30 -10 L 100 -50 L 115 -35 L 55 10 Z"/>
    <!-- Diacritic Diamonds -->
    <rect x="-95" y="70" width="16" height="16" rx="2" transform="rotate(45 -87 78)"/>
    <rect x="-65" y="70" width="16" height="16" rx="2" transform="rotate(45 -57 78)"/>
  </g>

  <!-- Persian Subtitle Ribbon -->
  <text x="256" y="420" text-anchor="middle" font-family="Vazirmatn, sans-serif" font-size="20" font-weight="600" fill="#f1cb83" letter-spacing="4" opacity="0.9">املاک و سرمایه‌گذاری</text>
  <line x1="80" y1="414" x2="140" y2="414" stroke="#f1cb83" stroke-width="1.5" opacity="0.6"/>
  <line x1="372" y1="414" x2="432" y2="414" stroke="#f1cb83" stroke-width="1.5" opacity="0.6"/>
</svg>
